services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nurai-dashboard
    ports:
      - "9800:9800"
    environment:
      # Backend API — change if Rasid API runs elsewhere
      API_BACKEND: ${API_BACKEND:-host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
