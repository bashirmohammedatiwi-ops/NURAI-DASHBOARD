services:
  postgres:
    image: postgres:16-alpine
    container_name: nurai-postgres
    environment:
      POSTGRES_USER: nurai
      POSTGRES_PASSWORD: nurai_secret
      POSTGRES_DB: nurai
    volumes:
      - nurai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nurai -d nurai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nurai-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nurai-api
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://nurai:nurai_secret@postgres:5432/nurai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - nurai_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # API داخلي فقط — اللوحة تتصل عبر api:9000 داخل شبكة Docker
    # لفتح API على VPS استخدم منفذاً غير 9000 (محجوز غالباً لـ MinIO):
    # ports:
    #   - "9002:9000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nurai-dashboard
    environment:
      API_BACKEND: api:9000
    depends_on:
      api:
        condition: service_started
    ports:
      - "9800:9800"
    restart: unless-stopped

volumes:
  nurai_pg_data:
  nurai_uploads:
